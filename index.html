<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#FFD700"><link rel="manifest" href="manifest.json"><title>V14 MEGA - Jose Marcos Lacerda</title><style>:root{--g:#FFD700}*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}body{background:#000;color:#fff;padding-bottom:80px}.top{position:sticky;top:0;z-index:99;background:#000;border-bottom:2px solid var(--g);padding:8px;display:flex;gap:7px;overflow:auto}.pill{white-space:nowrap;padding:10px 14px;border-radius:30px;border:2px solid #333;background:#1a1a1a;color:#fff;font-weight:900;font-size:13px}.pill.on{background:var(--g);color:#000}.wrap{max-width:760px;margin:auto;padding:10px}.card{margin:10px 0;border:2px solid var(--g);border-radius:18px;padding:14px;background:#111}.h{color:var(--g);font-weight:900}.btn{background:var(--g);color:#000;border:none;border-radius:30px;padding:12px;font-weight:900;width:100%;margin-top:6px}.in{width:100%;background:#000;border:2px solid #333;border-radius:10px;padding:11px;color:#fff;margin:5px 0}.item{display:flex;justify-content:space-between;align-items:center;background:#0f0f0f;border:1px solid #222;border-radius:12px;padding:10px;margin:6px 0}.screen{display:none}.screen.show{display:block}.clock{font-size:50px;text-align:center;color:var(--g);font-weight:900}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.calc-btn{background:#1a1a1a;border:2px solid #333;border-radius:12px;padding:16px;color:#fff;font-weight:800;font-size:18px}.op{background:var(--g)!important;color:#000!important}</style></head><body>

<button class="pill" onclick="tab('mercado',this)">🛒 Mercado</button>

<button class="pill" onclick="tab('grav',this)">🎙️ Gravar</button>

<button class="pill" onclick="tab('sonora',this)">🎵 Sonora</button>

<button class="calc-btn" onclick="calcIn('0')">0</button><button class="calc-btn" onclick="calcIn('.')">.</button><button class="calc-btn" onclick="calcIn('00')">00</button><button class="calc-btn op" onclick="calcEq()">=</button>
</div></div></div>
<div id="s-salario" class="screen"><div class="card"><h3 class="h">💼 Salário e Gastos</h3><input id="salValor" type="number" class="in" placeholder="Salário R$"><button class="btn" onclick="saveSal()">💾 Salvar Salário</button><br><br><input id="gastoDesc" class="in" placeholder="Gasto"><input id="gastoVal" type="number" class="in" placeholder="Valor"><button class="btn" onclick="addGasto()">💸 Adicionar Gasto</button><div id="listGastos"></div><h2 id="saldoSal" style="color:gold;text-align:center;margin-top:10px;border:2px solid gold;padding:10px;border-radius:12px">Restante: R$ 0</h2></div></div>
