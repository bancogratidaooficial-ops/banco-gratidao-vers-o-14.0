<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#FFD700"><link rel="manifest" href="manifest.json"><title>V14.4 MEGA 18 BOTOES</title><style>:root{--g:#FFD700}*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}body{background:#000;color:#fff;padding-bottom:90px}.top{position:sticky;top:0;z-index:99;background:#000;border-bottom:2px solid var(--g);padding:8px;display:flex;gap:7px;overflow:auto;white-space:nowrap}.pill{padding:10px 14px;border-radius:30px;border:2px solid #333;background:#1a1a1a;color:#fff;font-weight:900;font-size:13px}.pill.on{background:var(--g);color:#000}.wrap{max-width:800px;margin:auto;padding:10px}.card{margin:10px 0;border:2px solid var(--g);border-radius:18px;padding:14px;background:#111}.h{color:var(--g);font-weight:900;font-size:18px;margin-bottom:8px}.btn{background:var(--g);color:#000;border:none;border-radius:30px;padding:13px;font-weight:900;width:100%;margin-top:7px}.btn2{background:#111;color:var(--g);border:2px solid var(--g);border-radius:30px;padding:13px;font-weight:900;width:100%;margin-top:7px}.in{width:100%;background:#000;border:2px solid #333;border-radius:12px;padding:12px;color:#fff;margin:6px 0}.item{display:flex;justify-content:space-between;align-items:center;background:#0f0f0f;border:1px solid #222;border-radius:12px;padding:10px;margin:7px 0}.screen{display:none}.screen.show{display:block}.clock{font-size:48px;text-align:center;color:var(--g);font-weight:900}</style></head><body>
